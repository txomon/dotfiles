# Which age keys each encrypted file is written for.
#
# sops finds this by walking up from the file it is editing, so it applies to
# both secrets directories in README.md: this file sits two levels above
# `private/`, whether that is under $HOME or under the checkout.
#
# path_regex is matched against the path relative to this file.
#
# NOTHING IS LISTED YET, ON PURPOSE. Until you fill this in, sops refuses:
#
#   config file not found, or has no creation rules, and no keys provided
#   through command line options
#
# That refusal is the point. A file encrypted to a key nobody holds looks
# like a success and is unrecoverable, which is worse than not writing it.
# README.md, under Secrets, is the long version.
#
# Two edits make it work.
#
# 1. Your own key, the recipient on every host file so any of them can be
#    edited from any machine:
#
#      age-keygen -o ~/.config/sops/age/keys.txt
#
#    .gitignore already excludes that path via /.config/*. Back it up
#    somewhere off these machines: it is the only thing in this scheme whose
#    loss cannot be repaired. Paste the public half it prints as &admin below
#    and uncomment it.
#
# 2. One key per machine, which is what the machine itself decrypts with at
#    service start. As root on that host, once:
#
#      install -d -m 0700 /var/lib/sops-nix
#      age-keygen -o /var/lib/sops-nix/key.txt
#
#    Paste the public half as that host's anchor, add it to that host's rule,
#    and run `sops updatekeys <secrets dir>/<host>.yaml`. Losing a machine key
#    is repairable: make a new one and repeat. Until a host has one, only the
#    admin key can read its file and sops-install-secrets.service cannot.

# keys:
#   - &admin age1...
#   - &pippin age1...
#   - &rosita age1...
#   - &sam age1...
#
# creation_rules:
#   - path_regex: private/pippin\.yaml$
#     key_groups:
#       - age: [ *admin, *pippin ]
#
#   - path_regex: private/rosita\.yaml$
#     key_groups:
#       - age: [ *admin, *rosita ]
#
#   - path_regex: private/sam\.yaml$
#     key_groups:
#       - age: [ *admin, *sam ]
